<title>Hugo Streamer-Archiv</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Spickzettel. Streamer-Leiste links, kurze Liste in der Mitte, Joke-Pad rechts. Schmal: untereinander. */
:root {
  --bg: #f2f3f7; --surface: #ffffff; --ink: #17161d; --muted: #5d5b6b; --line: #dcdde6;
  --rec: #d6303a; --rec-soft: #fbe4e5; --violet: #5b3fd1; --violet-soft: #ebe6fd;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121118; --surface: #1c1b24; --ink: #ecebf3; --muted: #a29fb2; --line: #2f2d3b;
  --rec: #ff5a63; --rec-soft: #3a1b20; --violet: #a993ff; --violet-soft: #2a2343; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121118; --surface: #1c1b24; --ink: #ecebf3; --muted: #a29fb2; --line: #2f2d3b;
  --rec: #ff5a63; --rec-soft: #3a1b20; --violet: #a993ff; --violet-soft: #2a2343; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font: 800 clamp(26px, 4vw, 36px)/1.05 var(--f-display); margin: 0; letter-spacing: -0.02em; }
h1 .dot { display: inline-block; width: .42em; height: .42em; border-radius: 50%; background: var(--rec); margin-right: .25em; vertical-align: .12em; }
.how { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 6px 0 0; padding: 0; list-style: none; color: var(--muted); }
.how li { display: flex; align-items: center; gap: 8px; }
.how b { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--rec); color: #fff; font: 700 13px var(--f-mono); flex: none; }
input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: 210px minmax(0, 1fr) 330px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .grid { grid-template-columns: 190px minmax(0, 1fr); } .pad { grid-column: 1 / -1; } }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } }

nav.cast { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 720px) { nav.cast { position: static; max-height: none; flex-direction: row; overflow-x: auto; padding-bottom: 6px; } .cast h2, .cast details { display: none } }
.cast h2 { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 12px 8px 6px; }
.cast summary { cursor: pointer; font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 14px 8px 6px; }
.cast details[open] { display: flex; flex-direction: column; gap: 2px; }
.cast button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 8px; white-space: nowrap; }
.cast button:hover { background: var(--surface); }
.cast button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.cast button:focus-visible { outline: 2px solid var(--violet); }
.av { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; background: var(--line); }

.sheet { min-width: 0; display: grid; gap: 14px; }
.who { display: flex; align-items: center; gap: 14px; }
.who img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 3px solid var(--rec); flex: none; }
.who h2 { font: 800 clamp(28px, 4.5vw, 42px)/1 var(--f-display); margin: 0; letter-spacing: -0.02em; }
.who p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; }
.tags .k { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
.chip { padding: 2px 9px; border-radius: 999px; background: var(--violet-soft); color: var(--violet); }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; color: var(--muted); }
.bar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.group h3 { font: 800 15px var(--f-display); margin: 10px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
ul.lines { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.line { border-bottom: 1px solid var(--line); }
.line.unsure .txt { opacity: .62; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 2px; }
.yr { font: 600 13px var(--f-mono); color: var(--rec); font-variant-numeric: tabular-nums; }
.txt { all: unset; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.txt q { color: var(--violet); font-style: italic; }
.txt:focus-visible { outline: 2px solid var(--violet); }
.add { cursor: pointer; font: 700 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.add:hover { border-color: var(--rec); color: var(--rec); }
.add[aria-pressed="true"] { background: var(--rec); color: #fff; border-color: var(--rec); }
.more { padding: 0 2px 10px 64px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
@media (max-width: 520px) { .more { padding-left: 2px; } }
.more p { margin: 0; max-width: 65ch; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.links a { color: var(--violet); text-decoration: none; }
.links a:hover { text-decoration: underline; }
.empty { color: var(--muted); padding: 14px 2px; }
details.avoid { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); font-size: 14px; }
details.avoid summary { cursor: pointer; font-weight: 700; color: var(--rec); }
details.avoid ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }

.pad { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
@media (max-width: 1100px) { .pad { position: static; } }
.pad h2 { font: 800 22px/1 var(--f-display); margin: 0; }
.pad label { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pad textarea { resize: vertical; min-height: 44px; width: 100%; }
.or { text-align: center; font: 800 14px var(--f-display); color: var(--rec); }
.refs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.refs .chip button { all: unset; cursor: pointer; margin-left: 4px; font-weight: 700; }
.btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { cursor: pointer; font: 700 14px var(--f-body); border: 0; border-radius: 8px; padding: 9px 14px; background: var(--rec); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.status { font-size: 13px; color: var(--muted); }
.spark { font-size: 14px; background: var(--violet-soft); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.saved { display: grid; gap: 8px; max-height: 44vh; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 10px; }
.joke { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 4px; font-size: 14px; }
.joke .ab { font-weight: 700; overflow-wrap: anywhere; }
.joke .ab em { font-style: normal; color: var(--rec); padding: 0 4px; }
.joke .btns { justify-content: space-between; font-size: 12px; color: var(--muted); }
.joke select { font: inherit; padding: 2px 6px; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.del { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; }
.del:hover, .del.confirm { color: var(--rec); }
</style>

<div class="wrap">
  <header>
    <h1><span class="dot" aria-hidden="true"></span>Hugo Streamer-Archiv</h1>
    <ol class="how">
      <li><b>1</b> Streamer links wählen</li>
      <li><b>2</b> Zeile anklicken für Details, „+“ legt sie ins Pad</li>
      <li><b>3</b> Rechts A oder B schreiben und speichern</li>
    </ol>
  </header>

  <div class="grid">
    <nav class="cast" id="cast" aria-label="Streamer"><span class="empty">Lade …</span></nav>
    <main class="sheet" id="sheet"><p class="empty">Spickzettel lädt …</p></main>

    <aside class="pad" aria-label="Joke-Pad">
      <h2>Joke-Pad</h2>
      <label for="optA">Option A</label>
      <textarea id="optA" rows="2" placeholder="Immer wie Monte lachen"></textarea>
      <div class="or">oder</div>
      <label for="optB">Option B</label>
      <textarea id="optB" rows="2" placeholder="Einen Tag Trymacs' Eminem-Frisur tragen"></textarea>
      <label for="note">Notiz (optional)</label>
      <input id="note" type="text" placeholder="z. B. Bild B: Trymacs Oktober 2025">
      <div class="refs" id="refs" aria-live="polite"></div>
      <div class="btns">
        <button class="btn" id="save" type="button">Speichern</button>
        <button class="btn ghost" id="clear" type="button">Leeren</button>
        <span class="status" id="status"></span>
      </div>
      <div class="spark" id="spark"></div>
      <div class="saved" id="saved"><span class="empty">Gespeicherte Ideen landen hier.</span></div>
    </aside>
  </div>
</div>

<script>
const GROUPS = [["Sprüche & Running Gags", ["zitat", "gag", "meme"]], ["Momente & Events", ["moment"]], ["Look, Stimme & Macken", ["look", "sound", "habit"]]];
const STATUS = [["idee", "Idee"], ["gut", "Gut"], ["skript", "Ins Skript"], ["raus", "Raus"]];
const MUST = ["eliasn97", "niklaswilson", "sidneyeweka", "trymacs", "rumathra", "gtime", "knossi", "marli"];
let A = null, cur = null, showOld = false, refs = [], open = new Set();
let db = null, dbChecked = false, jokes = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, "") } catch { return "Quelle" } };
const byKey = k => A?.streamers.find(p => p.key === k);
const nameOf = k => byKey(k)?.name || k;
const lastYear = y => Math.max(0, ...(String(y ?? "").match(/20\d\d/g) || []).map(Number));
const recent = it => lastYear(it.year) >= 2023;
const avatar = (p, cls) => p.img ? `<img class="${cls}" src="${esc(p.img)}" alt="" loading="lazy">` : `<span class="${cls}"></span>`;

fetch("archive.json").then(r => r.json()).then(d => {
  A = d;
  const saved = store.get("cur");
  cur = byKey(saved) ? saved : MUST.find(byKey) || A.streamers[0].key;
  showOld = store.get("old") === "1";
  renderCast(); renderSheet(); renderSpark();
}).catch(() => { $("#sheet").innerHTML = '<p class="empty">Archiv nicht geladen. Seite neu laden.</p>'; });

function renderCast() {
  const btn = p => `<button type="button" data-k="${p.key}" aria-current="${p.key === cur}">${avatar(p, "av")}${esc(p.name)}</button>`;
  const must = MUST.map(byKey).filter(Boolean);
  const core = A.streamers.filter(p => p.core && !MUST.includes(p.key));
  const rest = A.streamers.filter(p => !p.core && p.items.length);
  const restOpen = rest.some(p => p.key === cur) ? " open" : "";
  $("#cast").innerHTML = `<h2>Muss rein</h2>${must.map(btn).join("")}<h2>Auch dabei</h2>${core.map(btn).join("")}
    <details${restOpen}><summary>Weitere (${rest.length})</summary>${rest.map(btn).join("")}</details>`;
}
$("#cast").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (!b) return;
  cur = b.dataset.k; store.set("cur", cur); open.clear();
  renderCast(); renderSheet();
  if (innerWidth < 720) $("#sheet").scrollIntoView({ behavior: "smooth" });
});

function lineHTML(it) {
  const on = refs.some(r => r.id === it.id), isOpen = open.has(it.id);
  const who = nameOf(it.with?.[0] || cur);
  const q = it.quote && it.quote !== it.label ? ` <q>${esc(it.quote)}</q>` : "";
  const img = `<a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(it.image || who + " " + it.label)}" target="_blank" rel="noopener">Bild suchen</a>`;
  const clip = `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(who + " " + (it.quote || it.label))}" target="_blank" rel="noopener">Clip suchen</a>`;
  const src = (it.sources || []).slice(0, 2).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(u))}</a>`).join("");
  const others = (it.with || []).filter(k => k !== cur).map(nameOf);
  return `<li class="line${it.conf === "low" ? " unsure" : ""}">
    <div class="row"><span class="yr">${lastYear(it.year) || "?"}</span>
      <button type="button" class="txt" data-open="${esc(it.id)}" aria-expanded="${isOpen}">${esc(it.label)}${q}</button>
      <button type="button" class="add" data-id="${esc(it.id)}" aria-pressed="${on}" aria-label="Ins Pad">${on ? "✓" : "+"}</button></div>
    ${isOpen ? `<div class="more">${it.detail ? `<p>${esc(it.detail)}</p>` : ""}${others.length ? `<p>Mit: ${others.map(esc).join(", ")}</p>` : ""}
      ${it.conf === "low" ? "<p>Nicht sicher belegt, vorher kurz checken.</p>" : ""}<div class="links">${img}${clip}${src}</div></div>` : ""}
  </li>`;
}

function renderSheet() {
  if (!A) return;
  const p = byKey(cur);
  const items = p.items.filter(it => showOld || recent(it)).sort((a, b) => lastYear(b.year) - lastYear(a.year));
  const hidden = p.items.length - items.length;
  const nick = [...(p.nicknames || []).map(n => n.name)].slice(0, 6).map(n => `<span class="chip">${esc(n)}</span>`).join("");
  const say = p.pronunciation?.tts_spelling ? `<span class="chip">${esc(p.pronunciation.tts_spelling)}</span>` : "";
  const groups = GROUPS.map(([title, cats]) => {
    const list = items.filter(i => cats.includes(i.cat));
    return list.length ? `<section class="group"><h3>${title}</h3><ul class="lines">${list.map(lineHTML).join("")}</ul></section>` : "";
  }).join("");
  const avoid = A.avoid.filter(a => a.who === p.key);
  $("#sheet").innerHTML = `
    <div class="who">${p.img ? `<img src="${esc(p.img)}" alt="">` : ""}<div><h2>${esc(p.name)}</h2>${p.vibe ? `<p>${esc(p.vibe)}</p>` : ""}</div></div>
    ${nick ? `<div class="tags"><span class="k">Spitznamen</span>${nick}</div>` : ""}
    ${say ? `<div class="tags"><span class="k">TTS spricht</span>${say}</div>` : ""}
    <div class="bar"><span>${items.length} Einträge${showOld ? "" : " ab 2023"}</span>
      <label><input type="checkbox" id="old" ${showOld ? "checked" : ""}> auch Älteres zeigen${!showOld && hidden ? ` (+${hidden})` : ""}</label></div>
    ${groups || `<p class="empty">Noch nichts ab 2023 zu ${esc(p.name)}. Haken bei „auch Älteres zeigen“ setzen.</p>`}
    ${avoid.length ? `<details class="avoid"><summary>Finger weg (${avoid.length})</summary><ul>${avoid.map(a => `<li>${esc(a.topic)}</li>`).join("")}</ul></details>` : ""}`;
}
$("#sheet").addEventListener("click", e => {
  const o = e.target.closest("[data-open]");
  if (o) { const id = o.dataset.open; open.has(id) ? open.delete(id) : open.add(id); renderSheet(); return; }
  const a = e.target.closest("button.add"); if (a) toggleRef(a.dataset.id);
});
$("#sheet").addEventListener("change", e => { if (e.target.id === "old") { showOld = e.target.checked; store.set("old", showOld ? "1" : "0"); renderSheet(); } });

function findItem(id) { for (const p of A.streamers) for (const it of p.items) if (it.id === id) return it; }
function toggleRef(id) {
  const i = refs.findIndex(r => r.id === id);
  if (i >= 0) refs.splice(i, 1);
  else { const it = findItem(id); if (it) refs.push({ id, label: it.label, who: (it.with || [])[0] || cur }); }
  renderRefs(); renderSheet(); saveDraft();
}
function renderRefs() { $("#refs").innerHTML = refs.map(r => `<span class="chip">${esc(nameOf(r.who))}: ${esc(r.label)}<button type="button" data-rm="${esc(r.id)}" aria-label="Entfernen">×</button></span>`).join(""); }
$("#refs").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) toggleRef(b.dataset.rm); });

function renderSpark() {
  const pool = [];
  for (const k of MUST) { const p = byKey(k); if (p) pool.push(...p.items.filter(i => recent(i) && i.conf !== "low")); }
  if (pool.length < 2) { $("#spark").hidden = true; return; }
  const pick = () => pool[Math.floor(Math.random() * pool.length)];
  let x = pick(), y = pick(), n = 0;
  while ((y.id === x.id || y.with?.[0] === x.with?.[0]) && n++ < 30) y = pick();
  $("#spark").innerHTML = `<span><b>Kein Plan?</b> ${esc(nameOf(x.with?.[0]))}: ${esc(x.label)} <b>vs</b> ${esc(nameOf(y.with?.[0]))}: ${esc(y.label)}</span>
    <div class="btns"><button class="btn ghost" type="button" id="reroll">Neu würfeln</button><button class="btn ghost" type="button" id="take" data-a="${esc(x.id)}" data-b="${esc(y.id)}">Ins Pad</button></div>`;
}
$("#spark").addEventListener("click", e => {
  if (e.target.id === "reroll") renderSpark();
  if (e.target.id === "take") [e.target.dataset.a, e.target.dataset.b].forEach(id => { if (!refs.some(r => r.id === id)) toggleRef(id); });
});

function saveDraft() { store.set("draft", JSON.stringify({ a: $("#optA").value, b: $("#optB").value, note: $("#note").value, refs })); }
try { const d = JSON.parse(store.get("draft") || "null"); if (d) { $("#optA").value = d.a || ""; $("#optB").value = d.b || ""; $("#note").value = d.note || ""; refs = d.refs || []; renderRefs(); } } catch {}
["#optA", "#optB", "#note"].forEach(s => $(s).addEventListener("input", saveDraft));
$("#clear").addEventListener("click", () => { $("#optA").value = $("#optB").value = $("#note").value = ""; refs = []; renderRefs(); renderSheet(); saveDraft(); });

const setStatus = t => { $("#status").textContent = t; };
function renderJokes() {
  const el = $("#saved");
  if (!db && dbChecked) { el.innerHTML = '<span class="empty">Speichern geht nur angemeldet auf claude.ai. Dein Entwurf bleibt in diesem Browser.</span>'; return; }
  if (!db || !jokes.length) { el.innerHTML = '<span class="empty">Gespeicherte Ideen landen hier.</span>'; return; }
  el.innerHTML = jokes.map(j => `<div class="joke" data-id="${esc(j.id)}">
    <div class="ab">${esc(j.a)}<em>oder</em>${esc(j.b)}</div>
    ${j.note ? `<div class="status">${esc(j.note)}</div>` : ""}
    <div class="btns"><select aria-label="Status" data-st>${STATUS.map(([v, l]) => `<option value="${v}" ${j.status === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    <button type="button" class="del" data-del>Löschen</button></div></div>`).join("");
}
$("#saved").addEventListener("change", async e => {
  const s = e.target.closest("[data-st]"); if (!s || !db) return;
  try { await db.collection("jokes").doc(s.closest(".joke").dataset.id).update({ status: s.value }); } catch { setStatus("Status nicht gespeichert."); }
});
$("#saved").addEventListener("click", async e => {
  const b = e.target.closest("[data-del]"); if (!b || !db) return;
  if (!b.classList.contains("confirm")) { b.classList.add("confirm"); b.textContent = "Wirklich löschen?"; setTimeout(() => { b.classList.remove("confirm"); b.textContent = "Löschen"; }, 3000); return; }
  try { await db.collection("jokes").doc(b.closest(".joke").dataset.id).delete(); } catch { setStatus("Löschen hat nicht geklappt."); }
});
$("#save").addEventListener("click", async () => {
  const a = $("#optA").value.trim(), b = $("#optB").value.trim();
  if (!a || !b) { setStatus("Beide Optionen ausfüllen."); return; }
  if (!db) { setStatus("Speichern geht nur angemeldet auf claude.ai."); return; }
  $("#save").disabled = true;
  try {
    await db.collection("jokes").add({ a, b, note: $("#note").value.trim(), refs, status: "idee", created: new Date().toISOString() });
    $("#optA").value = $("#optB").value = $("#note").value = ""; refs = []; renderRefs(); renderSheet(); saveDraft();
    setStatus("Gespeichert.");
  } catch (err) { setStatus(err?.code === "quota_exceeded" ? "Speicher voll. Alte Ideen löschen." : "Nicht gespeichert. Bist du angemeldet?"); }
  $("#save").disabled = false;
});
renderJokes();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  dbChecked = true;
  if (!db) { renderJokes(); return; }
  db.collection("jokes").orderBy("created", "desc").onSnapshot(s => { jokes = s.docs.map(d => ({ id: d.id, ...d.data() })); renderJokes(); }, () => { db = null; renderJokes(); });
})();
</script>
